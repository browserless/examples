# End-to-end test using BQL to verify page behavior.

mutation E2ECheck {
  goto(url: "https://scraping-sandbox.netlify.app/products", waitUntil: domContentLoaded) {
    status
  }

  title: mapSelector(selector: "title") {
    innerText
  }

  heading: mapSelector(selector: "h1") {
    innerText
  }

  links: mapSelector(selector: "a[href]") {
    href: attribute(name: "href") {
      value
    }
  }
}
